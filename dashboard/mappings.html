<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappings · Integration dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #18202b; --muted: #5f6b7a; --line: #d8dde5;
    --up: #1f8a4c; --down: #c0392b; --warn: #b7791f; --accent: #2456c7; --code: #fbfcfd;
    --kw: #8a2be2; --str: #1f7a45; --com: #7b8794; --num: #b4540a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151b; --panel: #181e27; --ink: #e6eaf0; --muted: #9aa5b4; --line: #2c3542;
      --up: #4cc38a; --down: #f0776a; --warn: #e0a84a; --accent: #7ea6ff; --code: #131922;
      --kw: #c39bff; --str: #7fd6a0; --com: #7d8896; --num: #f0a868;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink);
         display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 6px 0 0; font-weight: 650; }
  nav { display: flex; gap: 4px; margin-right: auto; }
  nav a { padding: 5px 11px; border-radius: 6px; color: var(--muted); text-decoration: none; border: 1px solid transparent; }
  nav a:hover { color: var(--accent); }
  nav a[aria-current="page"] { color: var(--ink); border-color: var(--line); background: var(--bg); font-weight: 600; }
  a { color: var(--accent); }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 0; }
  #list { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 10px; }
  #list button { display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 9px 11px; }
  #list button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  #list .t { font-weight: 600; display: block; }
  #list .d { color: var(--muted); font-size: 12px; display: block; }
  #work { overflow: auto; padding: 16px 18px 28px; min-width: 0; }
  #work h2 { font-size: 18px; margin: 0 0 4px; }
  .lead { margin: 0 0 4px; max-width: 95ch; }
  .meta { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; overflow-wrap: anywhere; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
  #status { color: var(--muted); font-size: 12.5px; }
  #status.bad { color: var(--down); } #status.good { color: var(--up); }
  .panes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-width: 0; min-height: 420px; }
  .pane h3 { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line); font-weight: 650; display: flex; justify-content: space-between; gap: 8px; }
  .pane h3 span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .pane textarea, .pane pre { flex: 1; margin: 0; border: 0; padding: 12px; background: var(--code); color: var(--ink); font: 12.5px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace;
    overflow: auto; white-space: pre; tab-size: 2; border-radius: 0 0 8px 8px; min-height: 0; }
  .pane textarea { resize: none; outline: none; }
  .pane textarea:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  .kw { color: var(--kw); } .str { color: var(--str); } .com { color: var(--com); font-style: italic; } .num { color: var(--num); }
  .err { color: var(--down); white-space: pre-wrap; }
  details { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  details summary { cursor: pointer; padding: 9px 12px; font-weight: 600; }
  details pre { margin: 0; padding: 12px; border-top: 1px solid var(--line); background: var(--code); font: 12.5px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace; overflow: auto; max-height: 420px; }
  .hint { background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 9px 12px; margin: 14px 0 0; }
  @media (max-width: 1100px) { .panes { grid-template-columns: 1fr; } .pane { min-height: 260px; } }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } #list { border-right: 0; border-bottom: 1px solid var(--line); max-height: 220px; } }
</style>
</head>
<body>
<header>
  <h1>Salesforce to finance integration</h1>
  <nav aria-label="Dashboard pages">
    <a href="/">Overview</a>
    <a href="/mappings" aria-current="page">Mappings</a>
  </nav>
  <a href="https://dataweave.mulesoft.com/learn/playground" target="_blank" rel="noopener" title="MuleSoft's public tool for trying DataWeave in the browser">Open DataWeave Playground</a>
</header>
<main>
  <div id="list" role="group" aria-label="Mappings"></div>
  <div id="work"><p class="meta">Loading mappings…</p></div>
</main>
<script>
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let mappings = [], current = null;

// Light colouring for DataWeave: comments, strings, numbers and keywords.
const KEYWORDS = ['import', 'from', 'output', 'var', 'fun', 'if', 'else', 'do', 'map', 'filter', 'default', 'as', 'and', 'or', 'not', 'null', 'true', 'false', 'using', 'matches', 'contains', 'replace', 'with', 'joinBy', 'groupBy', 'is'];
function highlight(code) {
  const pattern = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*\b)/g;
  let out = '', last = 0, m;
  while ((m = pattern.exec(code))) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += `<span class="com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="num">${esc(m[3])}</span>`;
    else out += KEYWORDS.includes(m[4]) ? `<span class="kw">${esc(m[4])}</span>` : esc(m[4]);
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

const sampleText = (m) => (m.inputType === 'csv' ? String(m.sample ?? '') : JSON.stringify(m.sample, null, 2));

function renderList() {
  document.getElementById('list').innerHTML = mappings.map((m) =>
    `<button data-id="${esc(m.id)}" aria-pressed="${current && current.id === m.id}"><span class="t">${esc(m.title)}</span><span class="d">${esc(m.direction)}</span></button>`).join('');
}

function select(id) {
  current = mappings.find((m) => m.id === id);
  renderList();
  const m = current;
  document.getElementById('work').innerHTML =
    `<h2>${esc(m.title)}</h2>` +
    `<p class="lead">${esc(m.summary)}</p>` +
    `<p class="meta">${esc(m.path)}</p>` +
    `<div class="bar"><button class="primary" id="run">Run mapping</button><button id="reset">Reset sample</button><span id="status" role="status"></span></div>` +
    `<div class="panes">` +
      `<section class="pane"><h3>Input <span>${m.inputType === 'csv' ? 'CSV, editable' : 'JSON, editable'}</span></h3><textarea id="input" spellcheck="false" aria-label="Sample input"></textarea></section>` +
      `<section class="pane"><h3>DataWeave <span>${esc(m.file)}</span></h3><pre id="script" tabindex="0" aria-label="DataWeave script">${highlight(m.script)}</pre></section>` +
      `<section class="pane"><h3>Output <span id="timing">from the Mule engine</span></h3><pre id="output" tabindex="0" aria-label="Mapping output"></pre></section>` +
    `</div>` +
    `<p class="hint"><strong>Try this:</strong> ${esc(m.tryThis)}</p>` +
    m.modules.map((mod) => `<details><summary>Uses ${esc(mod.file)}</summary><pre>${highlight(mod.script)}</pre></details>`).join('');
  document.getElementById('input').value = sampleText(m);
  document.getElementById('run').addEventListener('click', run);
  document.getElementById('reset').addEventListener('click', () => { document.getElementById('input').value = sampleText(m); run(); });
  document.getElementById('input').addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); } });
  run();
}

async function run() {
  const status = document.getElementById('status'), output = document.getElementById('output'), button = document.getElementById('run');
  const text = document.getElementById('input').value;
  let input = text;
  if (current.inputType === 'json') {
    try { input = JSON.parse(text); }
    catch (error) { status.className = 'bad'; status.textContent = 'The input is not valid JSON: ' + error.message; return; }
  }
  button.disabled = true; status.className = ''; status.textContent = 'Running…';
  try {
    const result = await (await fetch(`/api/mappings/${current.id}/run`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ input }) })).json();
    document.getElementById('timing').textContent = `from the Mule engine · ${result.ms} ms`;
    if (result.ok) {
      output.className = ''; output.innerHTML = highlight(JSON.stringify(result.body, null, 2));
      status.className = 'good'; status.textContent = 'Done. Edit the input and press Run mapping, or Ctrl+Enter.';
    } else {
      const message = result.status === 0 ? 'The process API is not running. Start the Mule runtime from the Overview page.'
        : (result.body && result.body.error && result.body.error.message) || `HTTP ${result.status}`;
      output.className = 'err'; output.textContent = message;
      status.className = 'bad'; status.textContent = 'The mapping could not run on this input.';
    }
  } catch (error) {
    output.className = 'err'; output.textContent = String(error);
    status.className = 'bad'; status.textContent = 'The dashboard server did not respond.';
  }
  button.disabled = false;
}

document.getElementById('list').addEventListener('click', (e) => { const b = e.target.closest('button[data-id]'); if (b) { select(b.dataset.id); history.replaceState(null, '', '#' + b.dataset.id); } });

(async () => {
  try {
    mappings = await (await fetch('/api/mappings')).json();
    const wanted = location.hash.slice(1);
    select(mappings.some((m) => m.id === wanted) ? wanted : mappings[0].id);
  } catch (error) {
    document.getElementById('work').innerHTML = '<p class="meta">The mappings could not be loaded. Is the dashboard server running?</p>';
  }
})();
</script>
</body>
</html>
